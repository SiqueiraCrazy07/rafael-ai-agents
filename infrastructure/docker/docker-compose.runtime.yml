services:
  runtime-core:
    build:
      context: ../..
      dockerfile: infrastructure/docker/runtime.Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - rafael-runtime
    labels:
      rafael.runtime.service: "runtime-core"
      rafael.runtime.role: "runtime-core"
      rafael.runtime.readonly-safe: "true"
      rafael.runtime.kubernetes-deploy: "false"
    environment:
      RUNTIME_READONLY_MODE: "true"
      RUNTIME_SAFE_MODE: "true"
      JSON_FALLBACK_ENABLED: "true"
    volumes:
      - runtime-data:/app/runtime-data
      - runtime-memory:/app/memory
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('runtime-core-health-readonly')"]
      interval: 30s
      timeout: 5s
      retries: 3

  workers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - rafael-runtime
    labels:
      rafael.runtime.service: "workers"
      rafael.runtime.role: "workers"
      rafael.runtime.readonly-safe: "true"
      rafael.runtime.kubernetes-deploy: "false"
    environment:
      RUNTIME_READONLY_MODE: "true"
      RUNTIME_SAFE_MODE: "true"
      WORKER_EXECUTION_MODE: "readonly-simulated"
    volumes:
      - runtime-data:/app/runtime-data
      - runtime-memory:/app/memory
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('workers-health-readonly')"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/gateway.Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - rafael-runtime
    labels:
      rafael.runtime.service: "gateway"
      rafael.runtime.role: "gateway"
      rafael.runtime.readonly-safe: "true"
      rafael.runtime.kubernetes-deploy: "false"
    environment:
      RUNTIME_READONLY_MODE: "true"
      RUNTIME_SAFE_MODE: "true"
      RUNTIME_GATEWAY_PUBLIC: "false"
      API_REQUIRE_AUTH: "true"
    volumes:
      - runtime-data:/app/runtime-data
      - runtime-memory:/app/memory
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('gateway-health-readonly')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  rafael-runtime:
    driver: bridge
    internal: true

volumes:
  runtime-data:
  runtime-memory:
