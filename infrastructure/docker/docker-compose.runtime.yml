services:
  runtime-core:
    build:
      context: ../..
      dockerfile: infrastructure/docker/runtime.Dockerfile
    read_only: true
    networks:
      - rafael-runtime
    environment:
      RUNTIME_READONLY_MODE: "true"
      RUNTIME_SAFE_MODE: "true"
      JSON_FALLBACK_ENABLED: "true"
    volumes:
      - runtime-data:/app/runtime-data
      - runtime-memory:/app/memory
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('runtime-core-health-readonly')"]
      interval: 30s
      timeout: 5s
      retries: 3

  workers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    read_only: true
    networks:
      - rafael-runtime
    environment:
      RUNTIME_READONLY_MODE: "true"
      RUNTIME_SAFE_MODE: "true"
      WORKER_EXECUTION_MODE: "readonly-simulated"
    volumes:
      - runtime-data:/app/runtime-data
      - runtime-memory:/app/memory

  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/gateway.Dockerfile
    read_only: true
    networks:
      - rafael-runtime
    environment:
      RUNTIME_READONLY_MODE: "true"
      RUNTIME_GATEWAY_PUBLIC: "false"
      API_REQUIRE_AUTH: "true"
    volumes:
      - runtime-data:/app/runtime-data
      - runtime-memory:/app/memory

networks:
  rafael-runtime:
    driver: bridge
    internal: true

volumes:
  runtime-data:
  runtime-memory:
